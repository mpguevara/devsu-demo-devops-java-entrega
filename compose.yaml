name: devsu-java

services:
  postgres:
    image: postgres:15.19-bookworm@sha256:11aa79b4af85f164ab3c2947fe6eb12795050fbea2ded3f6617f0c9eac094982
    environment:
      POSTGRES_DB: devsu
      POSTGRES_USER: devsu
      POSTGRES_PASSWORD: ${PASSWORD_DB:?Define PASSWORD_DB antes de iniciar PostgreSQL}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    mem_limit: 256m
    cpus: 1.0

volumes:
  postgres-data:
