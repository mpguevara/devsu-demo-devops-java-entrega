apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: devsu-app
  namespace: devsu
spec:
  ingressClassName: traefik-devsu
  rules:
    - host: devsu.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: devsu-app
                port:
                  name: http
